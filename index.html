<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hmmm...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginContainer" class="container">
    <div class="login-box">
      <h1>Hello...</h1>
      <div class="field">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="Go on, enter the password." />
      </div>
      <button id="loginBtn" class="login-button">Log In</button>
      <p id="errorMsg" class="error"></p>
    </div>
  </div>

  <div id="chatContainer" class="container hidden">
    <div class="chat-header">
      <div class="header-content">
        <span class="header-tag">the sanctuary?</span>
        <h2 id="friendName"></h2>
        <span id="syncDot" class="sync-dot" title="Checking sync..."></span>
      </div>
      <button id="logoutBtn" class="logout-btn" title="Log out">⟲</button>
    </div>

    <div id="connectionBanner" class="connection-banner hidden"></div>

    <div id="messagesList" class="messages-list"></div>

    <div class="message-input-area">
      <input type="text" id="messageInput" placeholder="Message..." />
      <button id="sendBtn" class="send-button" title="Send">➤</button>
    </div>
  </div>

 <script type="module" src="script.js"></script>
</body>
</html>
