<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hmmm...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginContainer" class="container">
    <div class="login-box">
      <div class="login-icon">hello</div>
      <h1>Hello...</h1>
      <input type="password" id="passwordInput" placeholder="Go on, enter the password." />
      <button id="loginBtn" class="login-button">Login</button>
      <p id="errorMsg" class="error"></p>
    </div>
  </div>

  <div id="chatContainer" class="container hidden">
    <div class="chat-header">
      <div class="header-content">
        <div class="header-avatar">the sanctuary?</div>
        <h2 id="friendName"></h2>
      </div>
      <button id="logoutBtn" class="logout-btn">⟲</button>
    </div>

    <div id="messagesList" class="messages-list"></div>

    <div class="message-input-area">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button id="sendBtn" class="send-button">→</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
